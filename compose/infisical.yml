services:
  infisical:
    image: infisical/infisical:v0.165.16
    container_name: infisical
    restart: unless-stopped
    depends_on:
      pgbouncer-transaction:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?}
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD:?}@pgbouncer-transaction:5432/infisical
      REDIS_URL: redis://:${INFISICAL_REDIS_PASSWORD:?}@infisical-redis:6379
      SITE_URL: ${SCHEME:?}://infisical.${DOMAIN:?}
      HTTPS_ENABLED: ${SECURE_COOKIES:?}
    networks:
      - infisical
      - postgres
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.infisical.rule=Host(`infisical.${DOMAIN:?}`)
      - traefik.http.services.infisical.loadbalancer.server.port=8080
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    mem_limit: ${INFISICAL_MEM_LIMIT:-0}

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${INFISICAL_REDIS_PASSWORD:?}", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${INFISICAL_REDIS_PASSWORD:?}
    networks:
      - infisical
    volumes:
      - infisical_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${INFISICAL_REDIS_MEM_LIMIT:-0}

networks:
  infisical: {}
  postgres: {}
  traefik: {}

volumes:
  infisical_redis_data: {}
