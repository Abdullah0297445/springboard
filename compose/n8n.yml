services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.8
    container_name: n8n
    restart: unless-stopped
    depends_on:
      pgbouncer-transaction:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: pgbouncer-transaction
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?}
      DB_POSTGRESDB_STATEMENT_TIMEOUT: 0
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_REINSTALL_MISSING_PACKAGES: true
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_PROXY_HOPS: 1
      N8N_HOST: n8n.${DOMAIN:?}
      N8N_PROTOCOL: ${SCHEME:?}
      N8N_EDITOR_BASE_URL: ${SCHEME:?}://n8n.${DOMAIN:?}/
      N8N_WEBHOOK_URL: ${SCHEME:?}://n8n.${DOMAIN:?}/
      N8N_SECURE_COOKIE: ${SECURE_COOKIES:?}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    networks:
      - n8n
      - postgres
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN:?}`)
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_traefik
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${N8N_MEM_LIMIT:-0}

  n8n-runners:
    image: docker.io/n8nio/runners:2.39.8
    container_name: n8n-runners
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
    networks:
      - n8n
    mem_limit: ${N8N_RUNNERS_MEM_LIMIT:-0}

networks:
  n8n: {}
  postgres: {}
  traefik: {}

volumes:
  n8n_data: {}
